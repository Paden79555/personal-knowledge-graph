<head>

  <style>
    :root{--bg:#06111f;--panel:#0b1424;--panel2:#101c31;--panel3:#13233d;--text:#eef5ff;--muted:#93a7c3;--line:#24405f;--blue:#4ea1ff;--cyan:#24d4ff;--violet:#a78bfa;--green:#33d69f;--amber:#f7c948;--rose:#fb7185;--orange:#fb923c;--shadow:0 24px 80px rgba(0,0,0,.32)}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"PingFang SC",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(78,161,255,.24),transparent 32%),radial-gradient(circle at 88% 5%,rgba(167,139,250,.18),transparent 28%),radial-gradient(circle at 50% 100%,rgba(36,212,255,.12),transparent 34%),var(--bg);color:var(--text);overflow:hidden}button,input{font:inherit}.app{height:100vh;display:grid;grid-template-columns:330px 1fr 390px;gap:0}.side,.inspector{height:100vh;overflow:auto;background:rgba(8,18,33,.84);backdrop-filter:blur(20px);border-color:var(--line)}.side{border-right:1px solid var(--line);padding:22px}.inspector{border-left:1px solid var(--line);padding:22px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{width:44px;height:44px;border-radius:16px;background:conic-gradient(from 210deg,var(--blue),var(--cyan),var(--violet),var(--blue));box-shadow:0 0 38px rgba(78,161,255,.35)}.brand h1{font-size:18px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.search{width:100%;background:#07101d;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;outline:none}.small-title{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin:20px 0 10px}.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode,.filter{border:1px solid var(--line);background:rgba(16,28,49,.72);color:var(--text);border-radius:12px;padding:10px 8px;cursor:pointer;text-align:center;font-size:13px}.mode.active,.filter.active{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(36,212,255,.25) inset;color:#bff5ff}.domain{padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:rgba(16,28,49,.55);cursor:pointer}.domain:hover,.domain.active{border-color:var(--blue);background:rgba(78,161,255,.12)}.domain b{display:flex;justify-content:space-between;font-size:14px}.domain span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45}.stage{position:relative;height:100vh;overflow:hidden}.topbar{position:absolute;z-index:5;left:22px;right:22px;top:18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.title-card{background:rgba(8,18,33,.76);border:1px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:var(--shadow)}.title-card h2{margin:0;font-size:22px}.title-card p{margin:4px 0 0;color:var(--muted);font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tool{border:1px solid var(--line);background:rgba(8,18,33,.82);color:var(--text);border-radius:999px;padding:9px 12px;cursor:pointer}.tool:hover{border-color:var(--cyan)}.canvas{position:absolute;inset:0}.graph-layer{width:100%;height:100%;cursor:grab}.graph-layer:active{cursor:grabbing}.link{stroke:#31506f;stroke-width:1.4;opacity:.68}.link.focus{stroke:var(--cyan);stroke-width:2.8;opacity:1}.node{cursor:pointer}.node circle{stroke:rgba(255,255,255,.6);stroke-width:1.4;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}.node text{fill:#eaf4ff;font-size:12px;text-anchor:middle;paint-order:stroke;stroke:#06111f;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.node.dim{opacity:.13}.node.focus circle{stroke:#fff;stroke-width:4}.tree,.cards{position:absolute;inset:96px 22px 22px;overflow:auto;display:none}.tree.active,.cards.active{display:block}.tree-root{display:grid;gap:14px}.tree-card{border:1px solid var(--line);border-radius:20px;background:rgba(16,28,49,.72);padding:18px}.tree-card h3{margin:0 0 12px;color:#dbeafe}.branch{margin-left:16px;border-left:1px dashed #355574;padding-left:14px}.leaf{display:inline-flex;margin:5px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#0b1424;cursor:pointer}.leaf:hover{border-color:var(--cyan)}.cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.cards.active{display:grid}.kcard{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(19,35,61,.9),rgba(11,20,36,.92));padding:18px;min-height:170px;cursor:pointer}.kcard:hover{border-color:var(--blue);transform:translateY(-2px);transition:.16s}.kcard h3{margin:0 0 8px}.kcard p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.badge{display:inline-block;margin:0 6px 6px 0;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:#cbd5e1;font-size:12px}.legend{position:absolute;left:22px;bottom:18px;display:flex;gap:8px;flex-wrap:wrap;background:rgba(8,18,33,.72);border:1px solid var(--line);border-radius:16px;padding:10px}.legend span{font-size:12px;color:var(--muted)}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.inspector h2{font-size:25px;margin:12px 0 8px}.inspector p{color:var(--muted);line-height:1.7}.path{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.crumb{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#0b1424}.actions{display:grid;gap:10px;margin:16px 0}.primary,.secondary{display:block;text-align:center;text-decoration:none;border-radius:13px;padding:12px 14px;font-weight:700}.primary{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}.secondary{border:1px solid var(--line);color:var(--text);background:#0b1424}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{border:1px solid var(--line);border-radius:14px;padding:12px;background:#0b1424}.metric b{display:block;font-size:22px}.metric span{font-size:11px;color:var(--muted)}.review{border:1px solid var(--line);border-radius:16px;background:rgba(19,35,61,.7);padding:14px;margin-top:14px}.review h3{margin:0 0 8px}.review ul{margin:0;padding-left:18px;color:var(--muted);line-height:1.7}.tooltip{position:absolute;z-index:20;display:none;pointer-events:none;background:#020617;border:1px solid var(--line);border-radius:12px;padding:10px;max-width:260px;box-shadow:var(--shadow);font-size:12px;color:var(--muted)}@media(max-width:1100px){body{overflow:auto}.app{height:auto;display:block}.side,.inspector{height:auto}.stage{height:760px}.topbar{position:relative;left:auto;right:auto;top:auto;margin:16px}.tree,.cards{inset:110px 16px 16px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"></div><div><h1>Knowledge Graph V2</h1><p>Graph · Tree · Card · HTML Nodes</p></div></div>
    <input id="search" class="search" placeholder="搜索节点、分类、标签..." />
    <div class="small-title">视图模式</div>
    <div class="mode-grid"><button class="mode active" data-view="graph">Graph</button><button class="mode" data-view="tree">Tree</button><button class="mode" data-view="cards">Cards</button></div>
    <div class="small-title">节点筛选</div>
    <div class="mode-grid"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="domain">分类</button><button class="filter" data-filter="knowledge-node">知识</button><button class="filter" data-filter="framework">框架</button><button class="filter" data-filter="playbook">流程</button><button class="filter" data-filter="active">活跃</button></div>
    <div class="small-title">科学分类总树</div>
    <div id="domainList"></div>
  </aside>
  <main class="stage">
    <div class="topbar"><div class="title-card"><h2>可探索的个人知识图谱</h2><p>拖拽画布、滚轮缩放、点击聚焦、邻居高亮、搜索定位、三视图切换。</p></div><div class="tools"><button class="tool" id="zoomIn">放大</button><button class="tool" id="zoomOut">缩小</button><button class="tool" id="reset">重置</button><button class="tool" id="fitActive">聚焦当前</button></div></div>
    <div class="canvas" id="graphView"><svg class="graph-layer" id="svg" viewBox="0 0 1100 760"><g id="viewport"><g id="links"></g><g id="nodes"></g></g></svg><div class="legend"><span><i class="sw" style="background:#4ea1ff"></i>领域</span><span><i class="sw" style="background:#22d3ee"></i>MOC</span><span><i class="sw" style="background:#a78bfa"></i>框架</span><span><i class="sw" style="background:#f7c948"></i>知识节点</span><span><i class="sw" style="background:#33d69f"></i>主题/流程</span></div></div>
    <div class="tree" id="treeView"></div>
    <div class="cards" id="cardsView"></div>
    <div class="tooltip" id="tip"></div>
  </main>
  <aside class="inspector" id="detail"></aside>
</div>
<script>
const nodes=[
{id:'root',title:'Personal Knowledge Graph',type:'root',domain:'root',status:'evergreen',level:0,x:550,y:380,summary:'个人知识图谱总入口：聚合科学分类、主题框架、细粒度知识节点和复盘机制。',tags:['root','moc'],url:'index.html'},
{id:'formal',title:'形式科学',type:'domain',domain:'formal',status:'candidate',level:1,x:270,y:110,summary:'数学、逻辑、统计、系统科学、计算理论。',tags:['math','logic']},
{id:'natural',title:'自然科学',type:'domain',domain:'natural',status:'candidate',level:1,x:550,y:78,summary:'物理、化学、生命科学、地球科学、天文学。',tags:['science']},
{id:'engineering',title:'工程与技术',type:'domain',domain:'engineering',status:'active',level:1,x:860,y:165,summary:'软件工程、AI 工程、数据系统、测试、安全、自动化。',tags:['tech','engineering']},
{id:'social',title:'社会科学',type:'domain',domain:'social',status:'active',level:1,x:875,y:560,summary:'经济、金融、管理、组织、心理、行为科学。',tags:['finance','society']},
{id:'humanities',title:'人文与表达',type:'domain',domain:'humanities',status:'candidate',level:1,x:550,y:690,summary:'哲学、历史、语言、文学、艺术、写作与表达。',tags:['humanities']},
{id:'life',title:'生活实践',type:'domain',domain:'life',status:'active',level:1,x:230,y:570,summary:'健康、关系、职业、消费、家庭、个人运营。',tags:['life']},
{id:'thinking',title:'学习与思考',type:'domain',domain:'thinking',status:'active',level:1,x:185,y:330,summary:'知识管理、学习路径、复盘系统、心智模型、研究方法。',tags:['thinking','learning']},
{id:'math-stats',title:'数学与统计',type:'topic',domain:'formal',status:'candidate',level:2,x:160,y:160,summary:'概率、统计、优化、建模和数据解释。',tags:['statistics']},
{id:'systems-science',title:'系统科学',type:'topic',domain:'formal',status:'candidate',level:2,x:360,y:185,summary:'复杂系统、反馈、控制论、网络科学。',tags:['systems']},
{id:'ai-engineering',title:'AI 工程',type:'topic',domain:'engineering',status:'active',level:2,x:790,y:270,summary:'LLM 工作流、Agent、Skill、提示词工程和自动化。',tags:['ai','llm']},
{id:'software-practice',title:'软件工程实践',type:'topic',domain:'engineering',status:'candidate',level:2,x:950,y:305,summary:'架构、调试、测试、质量、安全、工程效率。',tags:['software']},
{id:'finance-investing',title:'金融投资',type:'topic',domain:'social',status:'active',level:2,x:775,y:470,summary:'基金投资、组合管理、风险控制、投资假设与复盘。',tags:['finance']},
{id:'behavior-psychology',title:'行为与心理',type:'topic',domain:'social',status:'candidate',level:2,x:965,y:460,summary:'行为决策、认知偏差、动机与习惯。',tags:['psychology']},
{id:'health',title:'健康管理',type:'topic',domain:'life',status:'candidate',level:2,x:145,y:485,summary:'身体、睡眠、运动、营养、心理健康。',tags:['health']},
{id:'career',title:'职业与个人运营',type:'topic',domain:'life',status:'candidate',level:2,x:305,y:490,summary:'职业选择、长期目标、个人项目、时间精力管理。',tags:['career']},
{id:'knowledge-management',title:'知识管理',type:'moc',domain:'thinking',status:'active',level:2,x:330,y:330,summary:'个人知识系统、知识图谱、笔记压缩、MOC 与长期复盘。',tags:['pkm','moc']},
{id:'mental-models',title:'心智模型',type:'topic',domain:'thinking',status:'candidate',level:2,x:305,y:245,summary:'决策模型、系统思考、概率思维、反脆弱。',tags:['models']},
{id:'pkg-framework',title:'个人知识图谱建设框架',type:'framework',domain:'thinking',status:'evergreen',level:3,x:455,y:285,summary:'用 GitHub Pages 承载可浏览总知识地图，用本地 Markdown 做备份与发布源。',tags:['knowledge-graph','github-pages','framework'],url:'pages/frameworks/personal-knowledge-graph-framework.html'},
{id:'llm-km',title:'LLM 时代碎片化知识管理',type:'knowledge-node',domain:'thinking',status:'refined',level:4,x:565,y:230,summary:'把高频 LLM 对话压缩成可复习、可跳转、可复盘、可发布的知识节点。',tags:['llm','knowledge-management','review'],url:'pages/learning-thinking/llm-era-fragmented-knowledge-management.html'},
{id:'compression-protocol',title:'对话知识压缩协议',type:'method',domain:'thinking',status:'active',level:4,x:555,y:350,summary:'对话结束后进行价值筛选、快速回顾、框架定位、节点生成和发布判断。',tags:['prompt','compression']},
{id:'pages-layer',title:'GitHub Pages 发布层',type:'playbook',domain:'engineering',status:'active',level:3,x:700,y:360,summary:'把公开脱敏知识节点发布成可访问网页，本地只作为备份与生成中转。',tags:['github-pages','publishing']},
{id:'review-loop',title:'复盘闭环',type:'playbook',domain:'thinking',status:'candidate',level:3,x:435,y:430,summary:'为节点设置 review_after、复盘问题、升级/拆分/归档条件。',tags:['review']},
{id:'pkg-roadmap',title:'个人知识图谱后续开发文档',type:'framework',domain:'thinking',status:'active',level:3,x:610,y:430,summary:'沉淀 PRD、现状、架构约束、开发路线图、验证规则和下一步任务，方便后续继续开发。',tags:['roadmap','prd','development'],url:'pages/frameworks/personal-knowledge-graph-development-roadmap.html'},
{id:'ad-algorithm',title:'广告算法·Query改写与CTR知识体系',type:'framework',domain:'engineering',status:'active',level:3,x:700,y:210,summary:'覆盖Query改写（拼写纠正/语义改写/生成式改写）与CTR预估（序列建模/偏置校准/冷启动）的完整知识体系，含Bad Case驱动技术树与成长路线图。',tags:['ad','ctr','query-rewrite','ads'],url:'pages/ad-algorithm/query-rewrite-ctr-knowledge-system.html'}
];
const edges=[['root','formal'],['root','natural'],['root','engineering'],['root','social'],['root','humanities'],['root','life'],['root','thinking'],['formal','math-stats'],['formal','systems-science'],['engineering','ai-engineering'],['engineering','software-practice'],['social','finance-investing'],['social','behavior-psychology'],['life','health'],['life','career'],['thinking','knowledge-management'],['thinking','mental-models'],['knowledge-management','pkg-framework'],['pkg-framework','llm-km'],['llm-km','compression-protocol'],['compression-protocol','pages-layer'],['pkg-framework','pages-layer'],['pkg-framework','review-loop'],['pkg-framework','pkg-roadmap'],['ai-engineering','compression-protocol'],['ai-engineering','ad-algorithm']].map(([source,target])=>({source,target}));
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));const colors={root:'#f8fafc',domain:'#4ea1ff',moc:'#24d4ff',topic:'#33d69f',framework:'#a78bfa','knowledge-node':'#f7c948',method:'#fb7185',playbook:'#38bdf8'};let selected='root',filter='all',view='graph',scale=1,tx=0,ty=0,drag=null;
const svg=document.getElementById('svg'),vp=document.getElementById('viewport'),linksG=document.getElementById('links'),nodesG=document.getElementById('nodes'),detail=document.getElementById('detail'),tip=document.getElementById('tip');
function neighbors(id){return new Set(edges.flatMap(e=>e.source===id?[e.target]:e.target===id?[e.source]:[]))}function visible(n){const q=document.getElementById('search').value.toLowerCase();const text=(n.title+n.summary+n.type+n.status+n.tags.join(' ')).toLowerCase();return (!q||text.includes(q))&&(filter==='all'||n.type===filter||n.status===filter)}function applyTransform(){vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`)}
function draw(){linksG.innerHTML='';nodesG.innerHTML='';const ns=neighbors(selected);edges.forEach(e=>{const a=byId[e.source],b=byId[e.target];const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','link '+(e.source===selected||e.target===selected?'focus':''));linksG.appendChild(line)});nodes.forEach(n=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');const dim=selected!==n.id&&!neighbors(selected).has(n.id);g.setAttribute('class','node '+(visible(n)?'':'dim')+' '+(n.id===selected?'focus':'')+' '+(dim?'dim':''));g.setAttribute('transform',`translate(${n.x} ${n.y})`);g.onclick=ev=>{ev.stopPropagation();select(n.id)};g.onmousemove=ev=>{tip.style.display='block';tip.style.left=ev.clientX+14+'px';tip.style.top=ev.clientY+14+'px';tip.innerHTML=`<b>${n.title}</b><br>${n.summary}`};g.onmouseleave=()=>tip.style.display='none';const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r',n.type==='root'?38:n.type==='domain'?28:n.level>=4?18:22);c.setAttribute('fill',colors[n.type]||'#64748b');const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('y',n.type==='root'?54:40);t.textContent=n.title;g.append(c,t);nodesG.appendChild(g)});applyTransform()}
function lineage(id){const path=[];let cur=id,guard=0;while(cur&&guard++<8){path.unshift(cur);const parent=edges.find(e=>e.target===cur);cur=parent&&parent.source}return path.map(x=>byId[x]).filter(Boolean)}function select(id){selected=id;const n=byId[id],ns=[...neighbors(id)].map(x=>byId[x]);detail.innerHTML=`<span class="badge">${n.type}</span><span class="badge">${n.status}</span><h2>${n.title}</h2><p>${n.summary}</p><div class="path">${lineage(id).map(x=>`<span class="crumb">${x.title}</span>`).join('')}</div><div class="metrics"><div class="metric"><b>${ns.length}</b><span>关联节点</span></div><div class="metric"><b>${n.level}</b><span>知识层级</span></div><div class="metric"><b>${n.tags.length}</b><span>标签</span></div></div><div>${n.tags.map(t=>`<span class="badge">${t}</span>`).join('')}</div><div class="actions">${n.url?`<a class="primary" href="${n.url}">打开解析后的知识页</a>`:''}<a class="secondary" href="graph.json">查看 graph.json</a></div><div class="review"><h3>复盘提示</h3><ul><li>这个节点是否应该拆分为更细粒度知识点？</li><li>它和哪些节点存在依赖、冲突或可合并关系？</li><li>是否适合公开发布，是否需要脱敏？</li></ul></div><div class="review"><h3>相邻节点</h3>${ns.map(x=>`<span class="leaf" onclick="select('${x.id}')">${x.title}</span>`).join('')}</div>`;draw()}
function renderSide(){const domains=nodes.filter(n=>n.type==='domain');document.getElementById('domainList').innerHTML=domains.map(n=>`<div class="domain" data-id="${n.id}"><b>${n.title}<em>${nodes.filter(x=>x.domain===n.domain).length}</em></b><span>${n.summary}</span></div>`).join('');document.querySelectorAll('.domain').forEach(el=>el.onclick=()=>select(el.dataset.id))}function renderTree(){const domains=nodes.filter(n=>n.type==='domain');document.getElementById('treeView').innerHTML='<div class="tree-root">'+domains.map(d=>{const kids=nodes.filter(n=>n.domain===d.domain&&n.id!==d.id);return `<div class="tree-card"><h3>${d.title}</h3><p>${d.summary}</p><div class="branch">${kids.map(k=>`<span class="leaf" onclick="select('${k.id}');setView('graph')">${k.title}</span>`).join('')}</div></div>`}).join('')+'</div>'}function renderCards(){document.getElementById('cardsView').innerHTML=nodes.filter(n=>n.type!=='root'&&visible(n)).map(n=>`<div class="kcard" onclick="select('${n.id}');setView('graph')"><span class="badge">${n.type}</span><h3>${n.title}</h3><p>${n.summary}</p></div>`).join('')}
function setView(v){view=v;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('graphView').style.display=v==='graph'?'block':'none';document.getElementById('treeView').classList.toggle('active',v==='tree');document.getElementById('cardsView').classList.toggle('active',v==='cards');renderCards()}
svg.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaY<0?1.12:.89;scale=Math.max(.45,Math.min(2.8,scale*k));applyTransform()});svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty}});window.addEventListener('mousemove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;applyTransform()});window.addEventListener('mouseup',()=>drag=null);document.getElementById('zoomIn').onclick=()=>{scale*=1.16;applyTransform()};document.getElementById('zoomOut').onclick=()=>{scale*=.86;applyTransform()};document.getElementById('reset').onclick=()=>{scale=1;tx=0;ty=0;applyTransform()};document.getElementById('fitActive').onclick=()=>{const n=byId[selected];scale=1.25;tx=550-n.x*scale;ty=380-n.y*scale;applyTransform()};document.getElementById('search').oninput=()=>{draw();renderCards()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;draw();renderCards()});document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setView(b.dataset.view));renderSide();renderTree();select('root');
</script>
</body>
</html>
